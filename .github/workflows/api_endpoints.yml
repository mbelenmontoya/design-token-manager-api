name: API Endpoints Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/**'
      - 'src/controllers/**'
      - 'tests/integration/endpoints/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api_endpoints.yml'
  workflow_dispatch:

jobs:
  endpoints:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      PORT: 4000
      JWT_SECRET: ci-smoke-secret
      CLIENT_URL: http://localhost:5173
      MONGO_URI: mongodb://127.0.0.1:27017/design_tokens_ci?retryWrites=true&w=majority
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node src/scripts/seedUser.js
      - run: mkdir -p reports
      - run: npm run test:endpoints -- --json --outputFile=reports/endpoints.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoints-test-report
          path: reports/endpoints.json
