name: CI Pipeline (Temporarily Disabled)

# NOTE: CI is temporarily disabled per project decision.
# Keep for manual runs only while we finalize local migration/testing.
on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  
jobs:
  # Basic validation and linting
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Check for security vulnerabilities
      run: npm audit --audit-level=moderate
      
  # Supabase-focused tests
  supabase-tests:
    name: Supabase Tests
    runs-on: ubuntu-latest
    if: ${{ false }} # disabled
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Load env (use exact .env names)
      run: |
        set -e
        # If a repo environment already sets these, we keep them.
        # Otherwise, load from .env and export to GITHUB_ENV.
        if [ -f .env ]; then
          set -a
          source .env
          set +a
        fi
        for name in SUPABASE_URL SUPABASE_ANON_KEY DATABASE_URL DB_READS DB_WRITES API_KEY TENANT_ID PROJECT_ID ADMIN_USER; do
          val=$(printenv $name)
          if [ -n "$val" ]; then echo "$name=$val" >> $GITHUB_ENV; fi
        done

    - name: Bootstrap Supabase data (only if IDs missing)
      run: |
        set -e
        if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL is required" && exit 1; fi
        if [ -z "$API_KEY" ] || [ -z "$TENANT_ID" ] || [ -z "$PROJECT_ID" ]; then
          echo "Bootstrapping Supabase (generating API_KEY/TENANT_ID/PROJECT_ID)..."
          node scripts/bootstrapSupabase.js | tee bootstrap.out
          echo "Extracting bootstrap outputs..."
          TENANT_ID=$(grep -E "^Tenant ID:" bootstrap.out | awk -F': ' '{print $2}')
          PROJECT_ID=$(grep -E "^Project ID:" bootstrap.out | awk -F': ' '{print $2}')
          API_KEY=$(grep -E "^API Key\s+:" bootstrap.out | awk -F': ' '{print $2}')
          echo "TENANT_ID=$TENANT_ID" >> $GITHUB_ENV
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "API_KEY=$API_KEY" >> $GITHUB_ENV
        else
          echo "Using provided API_KEY/TENANT_ID/PROJECT_ID"
        fi

    - name: Start server (background)
      run: |
        node src/index.js &
        echo $! > server_pid
        for i in {1..60}; do
          if curl -sf http://localhost:4000/status/postgres >/dev/null; then
            echo "Server responding"; break; fi; sleep 1; done
        test -f server_pid || (echo "Server failed to start" && exit 1)
      env:
        DB_READS: ${{ env.DB_READS }}
        DB_WRITES: ${{ env.DB_WRITES }}
        DATABASE_URL: ${{ env.DATABASE_URL }}
        JWT_SECRET: ci-test-secret
        SUPABASE_URL: ${{ env.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}

    - name: Run Supabase tests
      run: CI_SERVER_MANAGED=1 npm run test:supabase
      env:
        DB_READS: ${{ env.DB_READS }}
        DB_WRITES: ${{ env.DB_WRITES }}
        DATABASE_URL: ${{ env.DATABASE_URL }}
        API_KEY: ${{ env.API_KEY }}
        TENANT_ID: ${{ env.TENANT_ID }}
        PROJECT_ID: ${{ env.PROJECT_ID }}

    - name: Stop server
      if: always()
      run: |
        if [ -f server_pid ]; then kill $(cat server_pid) || true; fi

  # Database migration validation
  # (Removed legacy migration-validation job)

  # Prisma schema validation
  prisma-validation:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    if: ${{ false }} # disabled
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Validate Prisma schema
      run: |
        npx prisma validate
        npx prisma format --check
        
    - name: Generate Prisma client (validation)
      run: npx prisma generate
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test

  # Security and dependency scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: ${{ false }} # disabled
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=high
      
    - name: Check for known vulnerabilities
      run: |
        # Check for any TODO/FIXME security issues
        ! grep -r "TODO.*security\|FIXME.*security" src/ || echo "Security TODOs found - review before merge"
        
        # Check for hardcoded secrets (basic check)
        ! grep -r "password\s*=\|secret\s*=\|api_key\s*=" src/ --exclude-dir=tests || echo "Potential hardcoded secrets found"

  # Documentation validation
  docs-validation:
    name: Documentation Validation  
    runs-on: ubuntu-latest
    if: ${{ false }} # disabled
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check documentation consistency
      run: |
        # Check that CLAUDE.md mentions all major components
        test -f CLAUDE.md || (echo "CLAUDE.md missing" && exit 1)
        test -f MIGRATION_PLAN.md || (echo "MIGRATION_PLAN.md missing" && exit 1)
        test -f ROADMAP.md || (echo "ROADMAP.md missing" && exit 1)
        
        # Check that PR template exists
        test -f .github/PULL_REQUEST_TEMPLATE.md || (echo "PR template missing" && exit 1)
        
        # Start server and verify Swagger docs using Supabase env
        node src/index.js &
        SERVER_PID=$!
        for i in {1..60}; do
          if curl -sf http://localhost:4000/api-docs/v1/ >/dev/null; then break; fi
          sleep 1
        done
        curl -f http://localhost:4000/api-docs/v1/ || (echo "Swagger docs not accessible" && exit 1)
        kill $SERVER_PID || true
      env:
        JWT_SECRET: ci-test-secret
        DB_READS: supabase
        DB_WRITES: supabase
        DATABASE_URL: ${{ env.DATABASE_URL }}
        SUPABASE_URL: ${{ env.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}

  # Build and deployment readiness
  build-validation:
    name: Build & Deploy Readiness
    runs-on: ubuntu-latest
    if: ${{ false }} # disabled
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: |
        # Test production build if we have one
        npm run build 2>/dev/null || echo "No build script defined"
        
    - name: Validate environment configuration
      run: |
        # Check that .env.example has all required variables
        test -f .env.example || (echo ".env.example missing" && exit 1)
        
        # Check for required environment variables
        grep -q "JWT_SECRET" .env.example || (echo "JWT_SECRET missing from .env.example" && exit 1)
        grep -q "SUPABASE_URL" .env.example || (echo "SUPABASE_URL missing from .env.example" && exit 1)
        grep -q "DATABASE_URL" .env.example || (echo "DATABASE_URL missing from .env.example" && exit 1)
        grep -q "DB_READS" .env.example || (echo "DB_READS missing from .env.example" && exit 1)
        grep -q "DB_WRITES" .env.example || (echo "DB_WRITES missing from .env.example" && exit 1)

# Require all jobs to pass for merge
status-check:
  name: All Checks Passed
  runs-on: ubuntu-latest
  needs: []
  if: always()
  
  steps:
    - name: Check all jobs status
      run: |
        if [[ "${{ needs.lint.result }}" != "success" ||
              "${{ needs.supabase-tests.result }}" != "success" ||
              "${{ needs.prisma-validation.result }}" != "success" ||
              "${{ needs.security-scan.result }}" != "success" ||
              "${{ needs.docs-validation.result }}" != "success" ||
              "${{ needs.build-validation.result }}" != "success" ]]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All checks passed successfully!"
